<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sleeper Mock Draft Simulator</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #080a0f;
    --panel: #10131a;
    --panel2: #171b23;
    --panel3: #1d222c;
    --border: #292f3b;
    --text: #f5f7fa;
    --muted: #8d96a5;
    --green: #65e6a5;
    --green-dark: #2fcf85;
    --blue: #659cff;
    --red: #ff647c;
    --yellow: #ffd166;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
}

/* ---------------- SETUP ---------------- */

#setup {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

.setup-card {
    width: 100%;
    max-width: 900px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 35px;
    box-shadow: 0 25px 100px rgba(0,0,0,.45);
}

.logo {
    font-size: 30px;
    font-weight: 900;
}

.logo span {
    color: var(--green);
}

.subtitle {
    color: var(--muted);
    margin-top: 7px;
    margin-bottom: 30px;
}

.settings-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

.setting {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.setting label {
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
}

.setting input,
.setting select {
    width: 100%;
    padding: 12px;
    background: var(--panel2);
    color: white;
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
}

.setting input:focus,
.setting select:focus {
    border-color: var(--green);
}

.roster-settings {
    margin-top: 28px;
}

.roster-title {
    font-size: 15px;
    font-weight: 800;
    margin-bottom: 12px;
}

.roster-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.start-btn {
    width: 100%;
    border: 0;
    background: var(--green);
    color: #06120b;
    padding: 15px;
    margin-top: 30px;
    border-radius: 9px;
    font-size: 15px;
    font-weight: 900;
}

.start-btn:hover {
    background: #80f1b8;
}

/* ---------------- TOP BAR ---------------- */

#app {
    min-height: 100vh;
}

.topbar {
    height: 64px;
    background: rgba(8,10,15,.96);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    position: sticky;
    top: 0;
    z-index: 50;
}

.top-logo {
    font-size: 19px;
    font-weight: 900;
}

.top-logo span {
    color: var(--green);
}

.top-left {
    display: flex;
    align-items: center;
    gap: 18px;
}

.draft-info {
    color: var(--muted);
    font-size: 12px;
}

.top-actions {
    display: flex;
    gap: 7px;
}

.small-btn {
    background: var(--panel2);
    color: white;
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 8px 11px;
}

.small-btn:hover {
    border-color: var(--green);
}

/* ---------------- TABS ---------------- */

.tabs {
    height: 47px;
    display: flex;
    align-items: center;
    gap: 25px;
    padding: 0 20px;
    border-bottom: 1px solid var(--border);
}

.tab {
    background: none;
    border: 0;
    color: var(--muted);
    height: 100%;
    padding: 0 3px;
    border-bottom: 2px solid transparent;
}

.tab.active {
    color: white;
    border-color: var(--green);
}

/* ---------------- BOARD ---------------- */

.board-wrapper {
    padding: 20px;
    overflow-x: auto;
}

.board {
    min-width: 900px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 11px;
    overflow: hidden;
}

.board-header,
.board-row {
    display: grid;
    grid-template-columns: 120px repeat(var(--rounds), minmax(115px, 1fr));
}

.board-header {
    background: #0c0f14;
}

.board-header div {
    padding: 11px 6px;
    text-align: center;
    color: var(--muted);
    font-size: 10px;
    font-weight: 800;
    border-right: 1px solid var(--border);
}

.board-row {
    border-top: 1px solid var(--border);
}

.team-name {
    display: flex;
    align-items: center;
    padding: 10px;
    font-size: 11px;
    font-weight: 800;
    border-right: 1px solid var(--border);
}

.team-name.you {
    color: var(--green);
}

.pick-cell {
    padding: 6px;
    min-height: 69px;
    border-right: 1px solid var(--border);
}

.pick {
    height: 100%;
    padding: 7px;
    border-radius: 6px;
    background: var(--panel2);
    border-left: 3px solid var(--blue);
}

.pick.you-pick {
    border-left-color: var(--green);
}

.pick-name {
    font-size: 10px;
    font-weight: 800;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.pick-meta {
    color: var(--muted);
    font-size: 9px;
    margin-top: 4px;
}

.empty-pick {
    height: 100%;
    min-height: 55px;
    border: 1px dashed #242a34;
    border-radius: 6px;
}

/* ---------------- DRAFT ---------------- */

.draft-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 370px;
    gap: 20px;
    padding: 20px;
}

.current-pick {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 15px;
}

.current-label {
    color: var(--muted);
    font-size: 10px;
    font-weight: 700;
}

.current-team {
    font-size: 16px;
    font-weight: 900;
    margin-top: 3px;
}

.current-round {
    color: var(--muted);
    font-size: 11px;
    margin-top: 4px;
}

.pick-number {
    color: var(--green);
    font-size: 27px;
    font-weight: 900;
}

/* ---------------- PLAYERS ---------------- */

.player-panel,
.roster-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 11px;
    overflow: hidden;
}

.panel-header {
    padding: 15px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    font-weight: 900;
}

.sleeper-status {
    padding: 9px 13px;
    border-bottom: 1px solid var(--border);
    font-size: 10px;
    color: var(--green);
}

.filters {
    display: flex;
    gap: 7px;
    padding: 11px;
    border-bottom: 1px solid var(--border);
}

.search {
    flex: 1;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 9px;
    color: white;
    outline: none;
}

.position-filter {
    background: var(--panel2);
    border: 1px solid var(--border);
    color: white;
    border-radius: 7px;
    padding: 8px;
}

.players {
    max-height: 620px;
    overflow-y: auto;
}

.player {
    display: grid;
    grid-template-columns: 34px minmax(0,1fr) 42px 60px;
    align-items: center;
    gap: 7px;
    padding: 9px 11px;
    border-bottom: 1px solid #1d222b;
}

.player:hover {
    background: var(--panel2);
}

.rank {
    color: var(--muted);
    font-size: 10px;
    text-align: center;
}

.player-name {
    font-size: 12px;
    font-weight: 800;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.player-team {
    color: var(--muted);
    font-size: 9px;
    margin-top: 3px;
}

.pos {
    font-size: 10px;
    font-weight: 900;
}

.draft-player {
    background: var(--green);
    border: 0;
    border-radius: 6px;
    padding: 6px 4px;
    font-size: 9px;
    font-weight: 900;
}

.draft-player:disabled {
    opacity: .2;
    cursor: not-allowed;
}

/* ---------------- ROSTER ---------------- */

.roster-panel {
    height: fit-content;
}

.roster-section {
    padding: 10px 12px;
}

.roster-section-title {
    color: var(--muted);
    font-size: 9px;
    font-weight: 900;
    margin-bottom: 6px;
    text-transform: uppercase;
}

.roster-slot {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 8px;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 5px;
}

.slot-position {
    width: 42px;
    color: var(--muted);
    font-size: 9px;
    font-weight: 800;
}

.slot-player {
    flex: 1;
    font-size: 11px;
    font-weight: 800;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.slot-team {
    color: var(--muted);
    font-size: 9px;
}

/* ---------------- FINISHED ---------------- */

.finished {
    text-align: center;
    padding: 80px 20px;
}

.finished h1 {
    font-size: 38px;
}

.finished p {
    color: var(--muted);
}

.restart {
    background: var(--green);
    color: #06120b;
    border: 0;
    border-radius: 8px;
    padding: 12px 22px;
    font-weight: 900;
}

/* ---------------- MOBILE ---------------- */

@media(max-width: 900px) {

    .draft-layout {
        grid-template-columns: 1fr;
    }

    .roster-panel {
        order: -1;
    }

    .settings-grid {
        grid-template-columns: 1fr;
    }

    .roster-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .draft-info {
        display: none;
    }
}
</style>
</head>

<body>

<!-- =========================================================
     SETUP
========================================================= -->

<section id="setup">

<div class="setup-card">

    <div class="logo">
        Fantasy <span>Mock Draft</span>
    </div>

    <div class="subtitle">
        Mock draft using live Sleeper player data.
    </div>

    <div class="settings-grid">

        <div class="setting">
            <label>League Name</label>
            <input id="leagueName" value="My Fantasy League">
        </div>

        <div class="setting">
            <label>Number of Teams</label>
            <select id="teamCount">
                <option>4</option>
                <option>6</option>
                <option>8</option>
                <option selected>10</option>
                <option>12</option>
                <option>14</option>
                <option>16</option>
            </select>
        </div>

        <div class="setting">
            <label>Your Draft Pick</label>
            <select id="draftPosition"></select>
        </div>

        <div class="setting">
            <label>Draft Type</label>
            <select id="draftType">
                <option value="snake">Snake</option>
                <option value="linear">Linear</option>
            </select>
        </div>

        <div class="setting">
            <label>Scoring</label>
            <select id="scoring">
                <option>PPR</option>
                <option>Half PPR</option>
                <option>Standard</option>
            </select>
        </div>

        <div class="setting">
            <label>Rounds</label>
            <select id="rounds">
                <option>8</option>
                <option>10</option>
                <option selected>15</option>
                <option>16</option>
                <option>18</option>
            </select>
        </div>

    </div>

    <div class="roster-settings">

        <div class="roster-title">
            Roster Settings
        </div>

        <div class="roster-grid">

            <div class="setting">
                <label>QB</label>
                <input id="QB" type="number" min="0" value="1">
            </div>

            <div class="setting">
                <label>RB</label>
                <input id="RB" type="number" min="0" value="2">
            </div>

            <div class="setting">
                <label>WR</label>
                <input id="WR" type="number" min="0" value="2">
            </div>

            <div class="setting">
                <label>TE</label>
                <input id="TE" type="number" min="0" value="1">
            </div>

            <div class="setting">
                <label>FLEX</label>
                <input id="FLEX" type="number" min="0" value="1">
            </div>

            <div class="setting">
                <label>K</label>
                <input id="K" type="number" min="0" value="1">
            </div>

            <div class="setting">
                <label>DEF</label>
                <input id="DEF" type="number" min="0" value="1">
            </div>

            <div class="setting">
                <label>Bench</label>
                <input id="BENCH" type="number" min="0" value="7">
            </div>

        </div>

    </div>

    <button class="start-btn" onclick="startDraft()">
        START MOCK DRAFT
    </button>

</div>

</section>


<!-- =========================================================
     APP
========================================================= -->

<section id="app" class="hidden">

<header class="topbar">

    <div class="top-left">

        <div class="top-logo">
            Fantasy <span>Mock</span>
        </div>

        <div class="draft-info" id="draftInfo"></div>

    </div>

    <div class="top-actions">

        <button class="small-btn" onclick="showBoard()">
            Board
        </button>

        <button class="small-btn" onclick="showDraft()">
            Draft
        </button>

        <button class="small-btn" onclick="resetDraft()">
            Reset
        </button>

    </div>

</header>


<!-- =========================================================
     BOARD VIEW
========================================================= -->

<div id="boardView">

    <div class="board-wrapper">

        <div class="board" id="board"></div>

    </div>

</div>


<!-- =========================================================
     DRAFT VIEW
========================================================= -->

<div id="draftView" class="hidden">

<div class="draft-layout">

<main>

    <div class="current-pick">

        <div>

            <div class="current-label">
                CURRENT PICK
            </div>

            <div class="current-team" id="currentTeam">
                Loading...
            </div>

            <div class="current-round" id="currentRound"></div>

        </div>

        <div class="pick-number" id="pickNumber">
            #1
        </div>

    </div>


    <div class="player-panel">

        <div class="panel-header">
            Available Players
        </div>

        <div class="sleeper-status" id="sleeperStatus">
            Loading Sleeper player data...
        </div>

        <div class="filters">

            <input
                id="search"
                class="search"
                placeholder="Search players..."
                oninput="renderPlayers()"
            >

            <select
                id="positionFilter"
                class="position-filter"
                onchange="renderPlayers()"
            >
                <option value="ALL">ALL</option>
                <option value="QB">QB</option>
                <option value="RB">RB</option>
                <option value="WR">WR</option>
                <option value="TE">TE</option>
                <option value="K">K</option>
                <option value="DEF">DEF</option>
            </select>

        </div>

        <div class="players" id="players"></div>

    </div>

</main>


<aside>

    <div class="roster-panel">

        <div class="panel-header">
            Your Roster
        </div>

        <div id="roster"></div>

    </div>

</aside>

</div>

</div>


<!-- =========================================================
     FINISHED
========================================================= -->

<div id="finishedView" class="hidden finished">

    <h1>Draft Complete</h1>

    <p>
        Your mock draft has finished.
    </p>

    <button class="restart" onclick="resetDraft()">
        Draft Again
    </button>

</div>

</section>


<script>

/* =========================================================
   GLOBAL STATE
========================================================= */

let players = [];
let sleeperLoaded = false;

let settings = {};
let teams = [];
let draft = [];
let drafted = new Set();

let currentPick = 0;


/* =========================================================
   SLEEPER API
========================================================= */

async function loadSleeperPlayers() {

    const status =
        document.getElementById("sleeperStatus");

    try {

        status.textContent =
            "Connecting to Sleeper...";

        const response = await fetch(
            "https://api.sleeper.app/v1/players/nfl"
        );

        if (!response.ok) {
            throw new Error(
                `Sleeper API returned ${response.status}`
            );
        }

        const data = await response.json();

        players = Object.values(data)

            .filter(player => {

                /*
                 * Sleeper player objects contain
                 * fantasy_positions.
                 */

                return (
                    player &&
                    player.player_id &&
                    player.full_name &&
                    Array.isArray(player.fantasy_positions)
                );

            })

            .filter(player => {

                /*
                 * Only use fantasy-relevant positions.
                 */

                return player.fantasy_positions.some(pos =>
                    ["QB","RB","WR","TE","K","DEF"].includes(pos)
                );

            })

            .map(player => {

                let position =
                    player.fantasy_positions.find(pos =>
                        ["QB","RB","WR","TE","K","DEF"].includes(pos)
                    );

                return {

                    id: player.player_id,

                    name: player.full_name,

                    team: player.team || "FA",

                    pos: position,

                    positions: player.fantasy_positions,

                    /*
                     * Sleeper's searchable player ranking.
                     */

                    rank:
                        Number.isFinite(Number(player.search_rank))
                            ? Number(player.search_rank)
                            : 9999,

                    status: player.status || "",

                    injuryStatus:
                        player.injury_status || null
                };

            })

            .sort((a,b) => a.rank - b.rank);


        /*
         * Prevent duplicate IDs.
         */

        const seen = new Set();

        players = players.filter(player => {

            if (seen.has(player.id)) {
                return false;
            }

            seen.add(player.id);

            return true;
        });


        sleeperLoaded = true;

        status.textContent =
            `✓ Sleeper data loaded • ${players.length.toLocaleString()} players`;

        renderPlayers();

    } catch(error) {

        console.error(error);

        status.style.color = "var(--red)";

        status.textContent =
            "✕ Could not load Sleeper data. Make sure you are online.";

    }
}


/*
 * Load immediately.
 */

loadSleeperPlayers();


/* =========================================================
   SETUP
========================================================= */

const teamCount =
    document.getElementById("teamCount");

const draftPosition =
    document.getElementById("draftPosition");


function updateDraftPositions() {

    draftPosition.innerHTML = "";

    const count =
        Number(teamCount.value);

    for(let i = 1; i <= count; i++) {

        const option =
            document.createElement("option");

        option.value = i;

        option.textContent =
            i;

        draftPosition.appendChild(option);
    }
}


teamCount.addEventListener(
    "change",
    updateDraftPositions
);

updateDraftPositions();


function startDraft() {

    if(!sleeperLoaded) {

        alert(
            "Sleeper player data is still loading. Please wait a moment."
        );

        return;
    }


    settings = {

        leagueName:
            document.getElementById("leagueName").value,

        teams:
            Number(document.getElementById("teamCount").value),

        userPick:
            Number(document.getElementById("draftPosition").value),

        type:
            document.getElementById("draftType").value,

        scoring:
            document.getElementById("scoring").value,

        rounds:
            Number(document.getElementById("rounds").value),

        roster: {

            QB:
                Number(document.getElementById("QB").value),

            RB:
                Number(document.getElementById("RB").value),

            WR:
                Number(document.getElementById("WR").value),

            TE:
                Number(document.getElementById("TE").value),

            FLEX:
                Number(document.getElementById("FLEX").value),

            K:
                Number(document.getElementById("K").value),

            DEF:
                Number(document.getElementById("DEF").value),

            BENCH:
                Number(document.getElementById("BENCH").value)
        }
    };


    teams = [];

    for(let i = 1; i <= settings.teams; i++) {

        teams.push({

            id: i,

            name:
                i === settings.userPick
                    ? "YOU"
                    : `Team ${i}`,

            roster: []
        });
    }


    draft = [];

    drafted = new Set();

    currentPick = 0;


    document
        .getElementById("setup")
        .classList.add("hidden");

    document
        .getElementById("app")
        .classList.remove("hidden");


    document
        .getElementById("draftInfo")
        .textContent =
            `${settings.leagueName} • ${settings.teams} Teams • ${settings.scoring}`;


    showBoard();

    renderBoard();

    renderRoster();

    renderPlayers();

    updateCurrentPick();

    processCPU();
}


/* =========================================================
   PICK ORDER
========================================================= */

function getTeamForPick(pickIndex) {

    const round =
        Math.floor(
            pickIndex / settings.teams
        );

    const position =
        pickIndex % settings.teams;


    /*
     * Snake draft reverses the order
     * every other round.
     */

    if(
        settings.type === "snake" &&
        round % 2 === 1
    ) {

        return settings.teams - position;

    }


    return position + 1;
}


function getRound(pickIndex) {

    return (
        Math.floor(
            pickIndex / settings.teams
        ) + 1
    );
}


/* =========================================================
   MAKE PICK
========================================================= */

function makePick(player, teamId) {

    if(!player) return;

    if(drafted.has(player.id)) return;


    drafted.add(player.id);


    const team =
        teams.find(
            t => t.id === teamId
        );

    if(!team) return;


    team.roster.push(player);


    draft.push({

        pick:
            currentPick + 1,

        round:
            getRound(currentPick),

        team:
            teamId,

        player:
            player
    });


    currentPick++;


    renderBoard();

    renderRoster();

    renderPlayers();

    updateCurrentPick();


    if(
        currentPick >=
        settings.teams * settings.rounds
    ) {

        finishDraft();

        return;
    }


    processCPU();
}


/* =========================================================
   CPU DRAFTING
========================================================= */

function processCPU() {

    if(
        currentPick >=
        settings.teams * settings.rounds
    ) {
        return;
    }


    const teamId =
        getTeamForPick(currentPick);


    /*
     * It's the user's turn.
     */

    if(teamId === settings.userPick) {

        showDraft();

        return;
    }


    setTimeout(() => {

        const team =
            teams.find(
                t => t.id === teamId
            );

        if(!team) return;


        const available =
            players.filter(
                p => !drafted.has(p.id)
            );


        if(!available.length) return;


        const player =
            chooseCPUPlayer(
                team,
                available
            );


        makePick(
            player,
            teamId
        );

    }, 350);
}


/* =========================================================
   CPU STRATEGY
========================================================= */

function chooseCPUPlayer(team, available) {

    const counts = {

        QB: 0,
        RB: 0,
        WR: 0,
        TE: 0,
        K: 0,
        DEF: 0
    };


    team.roster.forEach(player => {

        if(counts[player.pos] !== undefined) {

            counts[player.pos]++;
        }

    });


    const round =
        getRound(currentPick);


    /*
     * First 5 rounds:
     *
     * prioritize the best Sleeper-ranked player.
     */

    if(round <= 5) {

        return available
            .slice()
            .sort(
                (a,b) =>
                    a.rank - b.rank
            )[0];
    }


    /*
     * Determine roster needs.
     */

    const needs = [];


    if(
        counts.RB <
        settings.roster.RB
    ) {
        needs.push("RB");
    }


    if(
        counts.WR <
        settings.roster.WR
    ) {
        needs.push("WR");
    }


    if(
        counts.QB <
        settings.roster.QB
    ) {
        needs.push("QB");
    }


    if(
        counts.TE <
        settings.roster.TE
    ) {
        needs.push("TE");
    }


    /*
     * Kicker and defense late.
     */

    if(
        round >= settings.rounds - 2 &&
        counts.K < settings.roster.K
    ) {
        needs.push("K");
    }


    if(
        round >= settings.rounds - 2 &&
        counts.DEF < settings.roster.DEF
    ) {
        needs.push("DEF");
    }


    /*
     * Take the best ranked player
     * at a needed position.
     */

    for(
        const position of needs
    ) {

        const candidates =
            available

                .filter(player =>
                    player.positions.includes(position)
                )

                .sort(
                    (a,b) =>
                        a.rank - b.rank
                );


        if(candidates.length) {

            /*
             * Occasionally choose slightly
             * outside the top player to make
             * CPU drafts less predictable.
             */

            const index =
                Math.random() < .15
                    ? Math.min(
                        1,
                        candidates.length - 1
                    )
                    : 0;

            return candidates[index];
        }
    }


    /*
     * Otherwise best available.
     */

    return available
        .slice()
        .sort(
            (a,b) =>
                a.rank - b.rank
        )[0];
}


/* =========================================================
   DRAFT BOARD
========================================================= */

function renderBoard() {

    const board =
        document.getElementById("board");


    board.style.setProperty(
        "--rounds",
        settings.rounds
    );


    let html =
        `<div class="board-header">
            <div>TEAM</div>`;


    for(
        let round = 1;
        round <= settings.rounds;
        round++
    ) {

        html +=
            `<div>ROUND ${round}</div>`;
    }


    html +=
        `</div>`;


    teams.forEach(team => {

        html +=
            `<div class="board-row">

                <div class="team-name ${
                    team.id === settings.userPick
                        ? "you"
                        : ""
                }">
                    ${team.name}
                </div>`;


        for(
            let round = 1;
            round <= settings.rounds;
            round++
        ) {

            const pick =
                draft.find(
                    d =>
                        d.team === team.id &&
                        d.round === round
                );


            if(pick) {

                html +=
                    `<div class="pick-cell">

                        <div class="pick ${
                            team.id === settings.userPick
                                ? "you-pick"
                                : ""
                        }">

                            <div class="pick-name">
                                ${escapeHTML(
                                    pick.player.name
                                )}
                            </div>

                            <div class="pick-meta">
                                ${pick.player.pos}
                                • Sleeper #${pick.player.rank}
                            </div>

                        </div>

                    </div>`;

            } else {

                html +=
                    `<div class="pick-cell">
                        <div class="empty-pick"></div>
                    </div>`;
            }
        }


        html +=
            `</div>`;
    });


    board.innerHTML = html;
}


/* =========================================================
   PLAYER LIST
========================================================= */

function renderPlayers() {

    const container =
        document.getElementById("players");


    if(!container) return;

    if(!sleeperLoaded) {

        container.innerHTML =
            `<div style="
                padding:30px;
                text-align:center;
                color:#8d96a5;
            ">
                Loading Sleeper players...
            </div>`;

        return;
    }


    const search =
        (
            document.getElementById("search")
                ?.value || ""
        ).toLowerCase();


    const position =
        document.getElementById("positionFilter")
            ?.value || "ALL";


    const available =
        players

            .filter(player =>
                !drafted.has(player.id)
            )

            .filter(player => {

                if(
                    position !== "ALL" &&
                    !player.positions.includes(position)
                ) {
                    return false;
                }

                return true;
            })

            .filter(player => {

                if(!search) return true;

                return (
                    player.name
                        .toLowerCase()
                        .includes(search) ||

                    player.team
                        .toLowerCase()
                        .includes(search)
                );
            })

            .sort(
                (a,b) =>
                    a.rank - b.rank
            );


    let html = "";


    available.forEach(player => {

        const userTurn =
            getTeamForPick(currentPick) ===
            settings.userPick;


        const injury =
            player.injuryStatus
                ? ` • ${player.injuryStatus}`
                : "";


        html +=
            `<div class="player">

                <div class="rank">
                    ${player.rank >= 9999
                        ? "-"
                        : player.rank}
                </div>

                <div>

                    <div class="player-name">
                        ${escapeHTML(
                            player.name
                        )}
                    </div>

                    <div class="player-team">
                        ${escapeHTML(
                            player.team
                        )}${injury}
                    </div>

                </div>

                <div class="pos">
                    ${player.pos}
                </div>

                <button
                    class="draft-player"
                    onclick="draftUser('${player.id}')"
                    ${!userTurn
                        ? "disabled"
                        : ""}
                >
                    DRAFT
                </button>

            </div>`;
    });


    container.innerHTML =
        html ||
        `<div style="
            padding:30px;
            text-align:center;
            color:#8d96a5;
        ">
            No players found.
        </div>`;
}


/* =========================================================
   USER PICK
========================================================= */

function draftUser(playerId) {

    if(
        getTeamForPick(currentPick) !==
        settings.userPick
    ) {
        return;
    }


    const player =
        players.find(
            p => p.id === playerId
        );


    if(!player) return;


    makePick(
        player,
        settings.userPick
    );
}


/* =========================================================
   ROSTER VIEW
========================================================= */

function renderRoster() {

    const container =
        document.getElementById("roster");


    if(!container || !settings.roster) {
        return;
    }


    const team =
        teams.find(
            t => t.id === settings.userPick
        );


    if(!team) return;


    let html = "";


    /*
     * Normal positions.
     */

    const positions = [

        ["QB", settings.roster.QB],

        ["RB", settings.roster.RB],

        ["WR", settings.roster.WR],

        ["TE", settings.roster.TE],

        ["K", settings.roster.K],

        ["DEF", settings.roster.DEF]

    ];


    positions.forEach(
        ([position,count]) => {

            if(count <= 0) return;


            html +=
                `<div class="roster-section">

                    <div class="roster-section-title">
                        ${position}
                    </div>`;


            const matching =
                team.roster.filter(
                    player =>
                        player.pos === position
                );


            for(
                let i = 0;
                i < count;
                i++
            ) {

                const player =
                    matching[i];


                html +=
                    rosterSlotHTML(
                        position,
                        player
                    );
            }


            html +=
                `</div>`;
        }
    );


    /*
     * FLEX
     *
     * A FLEX can be filled by RB/WR/TE.
     */

    if(settings.roster.FLEX > 0) {

        const usedForFlex =
            getFlexEligiblePlayers(team);


        html +=
            `<div class="roster-section">

                <div class="roster-section-title">
                    FLEX
                </div>`;


        for(
            let i = 0;
            i < settings.roster.FLEX;
            i++
        ) {

            html +=
                rosterSlotHTML(
                    "FLEX",
                    usedForFlex[i]
                );
        }


        html +=
            `</div>`;
    }


    /*
     * Bench.
     */

    const starters =
        getStarterPlayers(team);


    const bench =
        team.roster.filter(
            player =>
                !starters.includes(player)
        );


    html +=
        `<div class="roster-section">

            <div class="roster-section-title">
                BENCH
            </div>`;


    for(
        let i = 0;
        i < settings.roster.BENCH;
        i++
    ) {

        html +=
            rosterSlotHTML(
                "BENCH",
                bench[i]
            );
    }


    html +=
        `</div>`;


    container.innerHTML = html;
}


function rosterSlotHTML(
    position,
    player
) {

    return `
        <div class="roster-slot">

            <div class="slot-position">
                ${position}
            </div>

            <div class="slot-player">
                ${
                    player
                        ? escapeHTML(player.name)
                        : "Empty"
                }
            </div>

            <div class="slot-team">
                ${
                    player
                        ? escapeHTML(player.team)
                        : ""
                }
            </div>

        </div>
    `;
}


/*
 * Determine players occupying normal
 * starting slots + FLEX.
 */

function getStarterPlayers(team) {

    const used = [];

    const usePosition =
        (position, count) => {

            const matching =
                team.roster.filter(
                    player =>
                        player.pos === position &&
                        !used.includes(player)
                );

            matching
                .slice(0,count)
                .forEach(player =>
                    used.push(player)
                );
        };


    usePosition(
        "QB",
        settings.roster.QB
    );

    usePosition(
        "RB",
        settings.roster.RB
    );

    usePosition(
        "WR",
        settings.roster.WR
    );

    usePosition(
        "TE",
        settings.roster.TE
    );

    usePosition(
        "K",
        settings.roster.K
    );

    usePosition(
        "DEF",
        settings.roster.DEF
    );


    /*
     * FLEX.
     */

    const flexEligible =
        team.roster.filter(
            player =>
                ["RB","WR","TE"].includes(player.pos) &&
                !used.includes(player)
        );


    flexEligible
        .slice(0, settings.roster.FLEX)
        .forEach(player =>
            used.push(player)
        );


    return used;
}


function getFlexEligiblePlayers(team) {

    const starters =
        [];


    /*
     * Fill normal positions first.
     */

    const use =
        (position,count) => {

            const matching =
                team.roster.filter(
                    player =>
                        player.pos === position &&
                        !starters.includes(player)
                );

            matching
                .slice(0,count)
                .forEach(player =>
                    starters.push(player)
                );
        };


    use("QB",settings.roster.QB);

    use("RB",settings.roster.RB);

    use("WR",settings.roster.WR);

    use("TE",settings.roster.TE);

    use("K",settings.roster.K);

    use("DEF",settings.roster.DEF);


    return team.roster
        .filter(
            player =>
                ["RB","WR","TE"].includes(player.pos) &&
                !starters.includes(player)
        )
        .slice(0,settings.roster.FLEX);
}


/* =========================================================
   CURRENT PICK
========================================================= */

function updateCurrentPick() {

    if(
        currentPick >=
        settings.teams * settings.rounds
    ) {
        return;
    }


    const teamId =
        getTeamForPick(currentPick);


    const team =
        teams.find(
            t => t.id === teamId
        );


    document.getElementById(
        "currentTeam"
    ).textContent =
        team
            ? team.name
            : "";


    document.getElementById(
        "currentRound"
    ).textContent =
        `Round ${getRound(currentPick)}`;


    document.getElementById(
        "pickNumber"
    ).textContent =
        `#${currentPick + 1}`;


    renderPlayers();
}


/* =========================================================
   VIEWS
========================================================= */

function showBoard() {

    document
        .getElementById("boardView")
        .classList.remove("hidden");

    document
        .getElementById("draftView")
        .classList.add("hidden");

    document
        .getElementById("finishedView")
        .classList.add("hidden");
}


function showDraft() {

    document
        .getElementById("boardView")
        .classList.add("hidden");

    document
        .getElementById("draftView")
        .classList.remove("hidden");

    document
        .getElementById("finishedView")
        .classList.add("hidden");

    renderPlayers();
}


function finishDraft() {

    document
        .getElementById("boardView")
        .classList.add("hidden");

    document
        .getElementById("draftView")
        .classList.add("hidden");

    document
        .getElementById("finishedView")
        .classList.remove("hidden");
}


/* =========================================================
   RESET
========================================================= */

function resetDraft() {

    document
        .getElementById("app")
        .classList.add("hidden");

    document
        .getElementById("setup")
        .classList.remove("hidden");
}


/* =========================================================
   SECURITY / HTML ESCAPING
========================================================= */

function escapeHTML(value) {

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}
